---
- hosts: all
  become: yes
  tasks:
    - name: Install Requirements
      apt: name={{ item }} state=present
      with_items:
        - openjdk-17-jdk
        - tmux
        - htop

    - name: Compile source code.
      shell: JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 /usr/share/maven/bin/mvn package
      args:
        chdir: "/vagrant/"

    - name: Startup Progression PLC
      shell: "tmux new -d java -jar /vagrant/node/target/node-1.0.jar && tmux send script SPACE /vagrant/scripts/progression.cmd ENTER"
      when: "'progression' in ansible_hostname"

    - name: Startup Brakes PLC
      shell: "tmux new -d java -jar /vagrant/node/target/node-1.0.jar && tmux send script SPACE /vagrant/scripts/brakes.cmd ENTER"
      when: "'brakes' in ansible_hostname"

    - name: Startup Security PLC
      shell: "tmux new -d java -jar /vagrant/node/target/node-1.0.jar && tmux send script SPACE /vagrant/scripts/security.cmd ENTER"
      when: "'security' in ansible_hostname"

    - name: Startup Engine PLC
      shell: "tmux new -d java -jar /vagrant/node/target/node-1.0.jar && tmux send script SPACE /vagrant/scripts/engine.cmd ENTER"
      when: "'engine' in ansible_hostname"

    - name: Startup Lights PLC
      shell: "tmux new -d java -jar /vagrant/node/target/node-1.0.jar && tmux send script SPACE /vagrant/scripts/engine.cmd ENTER"
      when: "'lights' in ansible_hostname"

